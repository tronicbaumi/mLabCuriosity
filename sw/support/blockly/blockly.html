<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>mLab Blockly</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #fff; }
    #blocklyDiv { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
  </style>
  <script src="blockly_compressed.js"></script>
  <script src="blocks_compressed.js"></script>
  <script src="python_compressed.js"></script>
  <script src="msg/en.js"></script>
  <script src="mlab_blocks.js"></script>
</head>
<body>
  <div id="blocklyDiv"></div>
  <script>
    // Called from Python (mlab_scope.py) via QWebEnginePage.runJavaScript.
    const workspace = Blockly.inject('blocklyDiv', {
      toolbox: MLAB_TOOLBOX,
      media: 'media/',
      trashcan: true,
      sounds: false,
      zoom: { controls: true, wheel: true, startScale: 0.9 },
      grid: { spacing: 20, length: 3, colour: '#ddd', snap: true },
      move: { scrollbars: true, drag: true, wheel: false },
    });

    const STARTER = {
      blocks: { languageVersion: 0, blocks: [{
        type: 'controls_whileUntil', x: 40, y: 40,
        inputs: {
          BOOL: { shadow: { type: 'logic_boolean', fields: { BOOL: 'TRUE' } } },
          DO: { block: { type: 'mlab_do_toggle', fields: { CH: '0' },
            next: { block: { type: 'mlab_wait_ms',
              inputs: { MS: { shadow: { type: 'math_number', fields: { NUM: 500 } } } } } } } },
        },
      }] },
    };

    function mlabLoad(jsonText) {
      workspace.clear();
      Blockly.serialization.workspaces.load(JSON.parse(jsonText), workspace);
      return true;
    }

    function mlabSave() {
      return JSON.stringify(Blockly.serialization.workspaces.save(workspace), null, 2);
    }

    function mlabNew() {
      workspace.clear();
      Blockly.serialization.workspaces.load(STARTER, workspace);
      return true;
    }

    // withTrace: add highlight()/check_stop() calls so the runner can show the
    // current block and stop infinite loops.
    function mlabGenerate(withTrace) {
      const gen = python.pythonGenerator;
      gen.STATEMENT_PREFIX = withTrace ? 'highlight(%1)\n' : null;
      gen.INFINITE_LOOP_TRAP = withTrace ? 'check_stop()\n' : null;
      try {
        return gen.workspaceToCode(workspace);
      } finally {
        gen.STATEMENT_PREFIX = null;
        gen.INFINITE_LOOP_TRAP = null;
      }
    }

    function mlabHighlight(id) {
      workspace.highlightBlock(id || null);
      return true;
    }

    mlabNew();
  </script>
</body>
</html>
